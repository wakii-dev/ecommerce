# Gateway :8080 — Spring Cloud Gateway (WebFlux).
# Route table nằm ở file riêng gateway-routes.yml (append-only per SF).
server:
  port: 8080

spring:
  application:
    name: gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import:
      - optional:classpath:gateway-routes.yml
      - optional:classpath:routes/gateway-auth.yml

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] [req=%X{requestId:-}] %logger{36} - %msg%n"
