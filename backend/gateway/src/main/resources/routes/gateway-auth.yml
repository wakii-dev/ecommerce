# ─────────────────────────────────────────────────────────────────────────────
# GATEWAY AUTH POLICY — SF-3 (FI-313). Public paths + admin prefixes TẬP TRUNG
# ở ĐÂY. SF sau cần path public (vd webhook) → THÊM 1 DÒNG vào public-paths.
# JWT: verify RS256 qua JWKS identity (spec §3.4). Unauthenticated → 401;
# authenticated thiếu role trên admin-prefixes → 403 (authorization chạy
# TRƯỚC route dispatch — /api/admin/** chưa route vẫn 403, không 404).
# ─────────────────────────────────────────────────────────────────────────────
ecom:
  gateway:
    auth:
      # Mặc định đi QUA chính gateway (path public) — không phụ thuộc strip nội bộ.
      jwks-uri: ${IDENTITY_JWKS_URI:http://localhost:8080/api/identity/.well-known/jwks.json}
      public-paths:
        - /api/smoke
        - /actuator/**
        - /api/*/actuator/**
        - /api/identity/auth/register
        - /api/identity/auth/login
        - /api/identity/auth/refresh
        - /api/identity/auth/logout          # contract: cookie-only, không bearerAuth
        - /api/identity/.well-known/**
        # SF-15 (FI-325): oauth browser flow — authorize/callback/exchange + discovery
        - /api/identity/oauth/**
        - /api/catalog/**                    # guest browse — public từ SF-4
        # SF-9 (FI-319): public theo contract (không security trên operation này)
        - /api/ordering/coupons/public       # coupon center — guest xem
        - /api/ordering/orders/validate-coupon # kiểm mã realtime — không reserve
        - /api/ordering/shipping/methods     # phí flat-fee — guest cần khi duyệt
        # SF-6 (2026-09-06): guest cart qua cookie cart_token (cart.yaml) —
        # identity per-request do cart-service tự xử (JWT có → validate 401 sai,
        # /api/cart/merge vẫn authenticated). /api/payment/intents FE stub gọi
        # trực tiếp để lấy clientSecret (pack SF-6: confirm thật qua SF-5).
        - /api/cart/**
        - /api/payment/intents
        # SF-11 (2026-09-07): partner Open API — CHỦ ĐÍCH public ở gateway:
        # auth là X-API-Key (không JWT customer), enforcement trong partner-api
        # (ApiKeyAuthFilter: 401/403/429). Docs portal cũng public (tự phục vụ).
        - /open-api/**
        # SF-12 (2026-09-07): track click public theo contract affiliate.yaml —
        # storefront capture ?ref không auth (204 im lặng, cookie do service set)
        - /api/affiliate/track/click
      admin-prefixes:
        - /api/admin/**                      # chữ ACCEPTANCE (path chưa route → 403 trước 404)
        - /api/identity/admin/**             # endpoint admin THẬT — D7 2 lớp (gateway + @PreAuthorize)
        - /api/ordering/admin/**             # SF-9 — 2 lớp (gateway + @PreAuthorize ordering)
        - /api/affiliate/admin/**            # SF-12 — 2 lớp (gateway + @PreAuthorize affiliate)
        # Convention SF sau: thêm prefix admin của service mình (vd /api/ordering/admin/**)
