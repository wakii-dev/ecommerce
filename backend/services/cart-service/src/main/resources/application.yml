# ─────────────────────────────────────────────────────────────────────────────
# cart-service (SF-6) — PORT TABLE (đổi khi fork):
#   gateway 8080 · identity 8081 · catalog 8082 · cart 8083 · inventory 8084
#   ordering 8085 · payment 8086 · notification 8087 · template 8099
# KHÔNG DATASOURCE (D8: cart = Redis thuần).
# SF-10: CÓ RabbitMQ consumer (order.confirmed → clear cart user) — KHÔNG
# publish (không outbox; exchange do cart tự declare, xem RabbitMqConfig).
# ─────────────────────────────────────────────────────────────────────────────
server:
  port: 8083

spring:
  application:
    name: cart-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

# Service khác — enrichment (pack: GET product theo slug hint) + stock check
cart:
  catalog-base-url: ${CATALOG_BASE_URL:http://localhost:8082}
  inventory-base-url: ${INVENTORY_BASE_URL:http://localhost:8084}
  ttl-days: ${CART_TTL_DAYS:30}
  cookie-name: cart_token

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true        # /actuator/health/{liveness,readiness}
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] [req=%X{requestId:-}] %logger{36} - %msg%n"
