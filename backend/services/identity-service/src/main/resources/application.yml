# identity :8081 · db_identity (D8). Path service-ngắn — gateway StripPrefix=2.
server:
  port: 8081

spring:
  application:
    name: identity-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/db_identity}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

# JWT RS256 — key sinh bằng `make keys` (make dev chạy `cd backend && mvn` nên
# default relative từ backend/ → ../infra/keys). PRODUCTION phải set env thật.
identity:
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH:../infra/keys/jwt-private.pem}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:../infra/keys/jwt-public.pem}
    kid: ${JWT_KID:identity-1}
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}   # 15'
  refresh:
    ttl-days: ${IDENTITY_REFRESH_TTL_DAYS:30}
    cookie-path: ${IDENTITY_COOKIE_PATH:/api/identity}   # path của BROWSER (qua gateway)
  seed:
    admin-email: ${ADMIN_EMAIL:}        # rỗng = skip seed (dev có thể export từ .env)
    admin-password: ${ADMIN_PASSWORD:}
  # SF-15 (FI-325) — OAuth Google/Facebook. Không key → provider tắt (well-known
  # false, authorize 400, FE ẩn nút). Endpoint URI override được cho WireMock IT.
  oauth:
    public-base-url: ${IDENTITY_OAUTH_PUBLIC_BASE_URL:http://localhost:8080}
    fe-redirect-base-url: ${IDENTITY_OAUTH_FE_REDIRECT_BASE:http://localhost:5173}
    google:
      client-id: ${OAUTH_GOOGLE_CLIENT_ID:}
      secret: ${OAUTH_GOOGLE_CLIENT_SECRET:}
      authorize-uri: ${OAUTH_GOOGLE_AUTHORIZE_URI:https://accounts.google.com/o/oauth2/v2/auth}
      token-uri: ${OAUTH_GOOGLE_TOKEN_URI:https://oauth2.googleapis.com/token}
      user-info-uri: ${OAUTH_GOOGLE_USERINFO_URI:https://openidconnect.googleapis.com/v1/userinfo}
      scope: "openid email profile"
    facebook:
      client-id: ${OAUTH_FACEBOOK_CLIENT_ID:}
      secret: ${OAUTH_FACEBOOK_CLIENT_SECRET:}
      authorize-uri: ${OAUTH_FACEBOOK_AUTHORIZE_URI:https://www.facebook.com/v19.0/dialog/oauth}
      token-uri: ${OAUTH_FACEBOOK_TOKEN_URI:https://graph.facebook.com/v19.0/oauth/access_token}
      user-info-uri: ${OAUTH_FACEBOOK_USERINFO_URI:https://graph.facebook.com/v19.0/me?fields=id,name,email}
      scope: "email,public_profile"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

outbox:
  relay:
    exchange: ecommerce.events
    poll-interval-ms: 2000
    max-attempts: 5
    batch-size: 100
    enabled: true

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] [req=%X{requestId:-}] %logger{36} - %msg%n"
