# inventory-service (SF-5) — fork từ template-service (SF-1).
# Port 8084 · DB riêng db_inventory (D8) · RabbitMQ consume order.paid/cancelled/failed.
server:
  port: 8084

spring:
  application:
    name: inventory-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    # Host port 5433 — compose map 5433:5432 (máy dev có postgres khác giữ 5432)
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/db_inventory}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

# Domain config — reservation TTL sweep + low-stock threshold
inventory:
  reservation:
    sweep-interval-ms: ${INVENTORY_SWEEP_INTERVAL_MS:30000}
    max-ttl-minutes: ${INVENTORY_MAX_TTL_MINUTES:60}
  low-stock-threshold: ${INVENTORY_LOW_STOCK_THRESHOLD:10}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Outbox relay (common-lib) — inventory publish inventory.reserved/committed/released
outbox:
  relay:
    exchange: ecommerce.events
    poll-interval-ms: 2000
    max-attempts: 5
    batch-size: 100
    enabled: true

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] [req=%X{requestId:-}] %logger{36} - %msg%n"
