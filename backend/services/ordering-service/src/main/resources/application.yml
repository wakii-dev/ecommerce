# ordering-service (SF-9) — fork từ template-service (SF-1).
# Port 8085 · DB riêng db_ordering (D8) · RabbitMQ consume payment.* + inventory.*.
server:
  port: 8085

spring:
  application:
    name: ordering-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    # Host port 5433 — compose map 5433:5432 (máy dev có postgres khác giữ 5432)
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/db_ordering}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  security:
    oauth2:
      resourceserver:
        jwt:
          # JWKS của identity — qua gateway như gateway-auth.yml (đổi khi wire service-token)
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8080/api/identity/.well-known/jwks.json}

# ── Saga: các service bên ngoài (command edges §3.2 — sync REST) ─────────
ordering:
  # TTL cancel (pack): order PENDING quá 35' → CANCELLED (safety net SAU TTL
  # inventory 30'; inventory tự release trước, event inventory.released là
  # đường chính — scheduler này chỉ bắt event mất/không tới).
  ttl-cancel-seconds: ${ORDERING_TTL_CANCEL_SECONDS:2100}
  sweep-interval-ms: ${ORDERING_SWEEP_INTERVAL_MS:30000}
  pricing:
    # Catalog là authority giá §6.1. Endpoint admin-by-id duy nhất address-by-id
    # trong contract freeze — REQUIREMENT-GAP FI-310 (comment 94b8496e): chờ
    # internal endpoint/service-token thì đổi URL + token, saga không đổi.
    base-url: ${CATALOG_BASE_URL:http://localhost:8082}
    by-id-path: ${CATALOG_BY_ID_PATH:/api/catalog/admin/products/}
    token: ${CATALOG_API_TOKEN:}
    timeout-ms: ${CATALOG_TIMEOUT_MS:5000}
  inventory:
    base-url: ${INVENTORY_BASE_URL:http://localhost:8084}
    timeout-ms: ${INVENTORY_TIMEOUT_MS:5000}
  payment:
    base-url: ${PAYMENT_BASE_URL:http://localhost:8086}
    timeout-ms: ${PAYMENT_TIMEOUT_MS:8000}
  ghn:
    # SF-14 (D22): GHN vận chuyển — token rỗng → fallback flat-fee (degraded)
    api-url: ${GHN_API_URL:https://dev-online-gateway.ghn.vn}
    token: ${GHN_TOKEN:}
    shop-id: ${GHN_SHOP_ID:}
    # District gửi hàng (demo: Quận 1 TP.HCM = 1454 theo GHN dev)
    from-district-id: ${GHN_FROM_DISTRICT_ID:1454}
    timeout-ms: ${GHN_TIMEOUT_MS:5000}
  rma:
    # SF-14 (D22): cửa sổ tạo yêu cầu trả hàng kể từ DELIVERED
    window-days: ${RMA_WINDOW_DAYS:7}
  loyalty:
    # SF-14 (D22): affiliate-service lo điểm — redeem service-to-service
    base-url: ${AFFILIATE_BASE_URL:http://localhost:8092}
    internal-token: ${AFFILIATE_INTERNAL_TOKEN:dev-internal-token}
    timeout-ms: ${AFFILIATE_TIMEOUT_MS:5000}
  invoice:
    # D18 — invoice-service gọi TRỰC TIẾP (:8090), KHÔNG qua gateway.
    base-url: ${INVOICE_SERVICE_URL:http://localhost:8090}
    mau-so: ${INVOICE_MAU_SO:01/001}
    ky-hieu: ${INVOICE_KY_HIEU:C26}
    vat-rate: ${INVOICE_VAT_RATE:10}
    seller-name: ${INVOICE_SELLER_NAME:Cửa hàng Demo Ecommerce}
    seller-address: ${INVOICE_SELLER_ADDRESS:123 Đường Thử Nghiệm, Phường Bến Nghé, Quận 1, TP. Hồ Chí Minh}
    seller-phone: ${INVOICE_SELLER_PHONE:028 1234 5678}
    seller-tax-id: ${INVOICE_SELLER_TAX_ID:0312345678}
    timeout-ms: ${INVOICE_TIMEOUT_MS:8000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Outbox relay (common-lib) — ordering publish order.created/paid/confirmed/cancelled/failed
outbox:
  relay:
    exchange: ecommerce.events
    poll-interval-ms: 2000
    max-attempts: 5
    batch-size: 100
    enabled: true

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] [req=%X{requestId:-}] %logger{36} - %msg%n"
