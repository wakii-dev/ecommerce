# payment-service (SF-5) — fork từ template-service (SF-1).
# Port 8086 · DB riêng db_payment (D8) · Stripe test mode qua SPI adapter.
server:
  port: 8086

spring:
  application:
    name: payment-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    # Host port 5433 — compose map 5433:5432 (máy dev có postgres khác giữ 5432)
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/db_payment}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

# Stripe test mode (D3) — KHÔNG key → degraded mode: boot OK, POST /payment/intents
# → 503 payment_unconfigured (pack item 9). KHÔNG commit key thật vào git.
# base-url override chỉ dùng cho IT (WireMock double) — prod giữ default.
stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  base-url: ${STRIPE_BASE_URL:https://api.stripe.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Outbox relay — payment publish payment.succeeded|failed từ webhook
outbox:
  relay:
    exchange: ecommerce.events
    poll-interval-ms: 2000
    max-attempts: 5
    batch-size: 100
    enabled: true

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] [req=%X{requestId:-}] %logger{36} - %msg%n"
