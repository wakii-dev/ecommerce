# ─────────────────────────────────────────────────────────────────────────────
# PORT TABLE (đổi `server.port` khi fork service thật):
#   gateway 8080 · identity 8081 · catalog 8082 · cart 8083 · inventory 8084
#   ordering 8085 · payment 8086 · notification 8087 · template 8099
# DB-PER-SERVICE (D8): db_identity/db_catalog/db_ordering/db_payment/db_inventory
#   (+ db_template sandbox — chỉ template dùng)
# Profile `dev`: đọc env do compose infra expose trên localhost (make infra).
# ─────────────────────────────────────────────────────────────────────────────
server:
  port: 8099

spring:
  application:
    name: template-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/db_template}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  # Mail qua Mailpit (dev) — service có gửi email thì bật starter-mail + block dưới:
  # mail:
  #   host: ${MAIL_HOST:localhost}
  #   port: ${MAIL_PORT:1025}
  # Redis (service dùng cache/cart thì bật starter-data-redis):
  # data:
  #   redis:
  #     host: ${REDIS_HOST:localhost}
  #     port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true        # /actuator/health/{liveness,readiness}
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Outbox relay (common-lib) — service không publish event thì đặt enabled: false
outbox:
  relay:
    exchange: ecommerce.events
    poll-interval-ms: 2000
    max-attempts: 5
    batch-size: 100
    enabled: true

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] [req=%X{requestId:-}] %logger{36} - %msg%n"
