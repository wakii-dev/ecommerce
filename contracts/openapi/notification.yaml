openapi: 3.1.0
info:
  title: Notification API
  version: 1.0.0
  description: |
    Notification service — THUẦN event-driven: consume `order.confirmed` (email xác nhận),
    `order.cancelled` (email hủy), `review.moderated` (email kết quả duyệt review) từ
    exchange `ecommerce.events` rồi gửi email qua SMTP (sink dev = Mailpit). Service KHÔNG
    có REST controller nào — email content debug qua Mailpit UI (thay cho log admin API cũ).
servers:
  - url: /
    description: Same origin — service nội bộ; baseURL inject qua config khi runtime.
tags:
  - name: notification
    description: Event-driven email — không còn REST surface.
paths:
  # SF-4 (FI-408, CT-20/21): 2 REST op cũ (POST /api/notification/emails,
  # GET /api/notification/admin/emails) đã bỏ — notification-service có ZERO REST
  # controller (chỉ consume events + SMTP). Path keys giữ RỖNG (OpenAPI 3.1 Path
  # Item không bắt buộc operation) vì scripts/qa/contracts-freshness.mjs fail-loud
  # exit 2 khi một yaml không còn path key nào — `paths: {}` thuần không probe được.
  /api/notification/emails:
    description: ĐÃ BỎ — không còn REST endpoint (service thuần event-driven).
  /api/notification/admin/emails:
    description: ĐÃ BỎ — không còn REST endpoint; nội dung email xem qua Mailpit UI.
