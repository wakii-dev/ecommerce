# Ecommerce platform — INFRA ONLY (dev mode).
# Backend services KHÔNG containerize ở dev — chạy host qua `make dev svc=<name>`.
# Containerize toàn bộ = profile `full` (SF-10, `make full`).
# Append-only per SF (shared-file ownership §6): SF mới thêm service block, không sửa block người khác.

name: ecommerce

services:
  postgres:
    image: postgres:16
    container_name: ecommerce-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      # Host 5433 (không phải 5432): máy dev đang có postgres compose khác
      # (hub-store) giữ 5432 — override bằng PG_HOST_PORT trong .env nếu cần.
      - "${PG_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7
    container_name: ecommerce-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ecommerce-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mailpit:
    image: axllent/mailpit
    container_name: ecommerce-mailpit
    ports:
      - "1025:1025"   # SMTP sink (services gửi mail dev vào đây)
      - "8025:8025"   # UI xem email
    volumes:
      - mailpitdata:/data
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8025/readyz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # D14 (2026-09-06): mongo cho log-service (SF-10 build service; container từ SF-1)
  mongo:
    image: mongo:7
    container_name: ecommerce-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mongo-express:
    image: mongo-express:1.0.2
    container_name: ecommerce-mongo-express
    ports:
      - "8089:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH: "false"   # dev-only UI — không auth (k8s/prod sẽ không chạy mongo-express)
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - ecommerce-net
    healthcheck:
      # image node-alpine — không có wget/curl, dùng http.get của node
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8081',r=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # D15 (2026-09-06): Elasticsearch cho search (SF-4 build engine/indexer; container từ SF-1)
  elasticsearch:
    image: elasticsearch:8.17.4
    container_name: ecommerce-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s

  # Chỉ bật khi cần test webhook Stripe thật: docker compose --profile stripe up -d stripe-cli
  # Forward → payment-service chạy host :8086 (SF-5 sở hữu endpoint).
  # NOTE (SF-5 fix): service mount /payment/webhook (gateway StripPrefix bóc /api
  # khi đi qua :8080) — forward thẳng service path, không có /api.
  stripe-cli:
    image: stripe/stripe-cli
    container_name: ecommerce-stripe-cli
    profiles:
      - stripe
    command: listen --forward-to host.docker.internal:8086/payment/webhook
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY:-}  # thiếu key → stripe-cli lỗi rõ khi bật profile, không vỡ compose
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "stripe", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3

  # SF-4 (2026-09-06): catalog-service (port 8082, db_catalog) — KHÔNG chạy dev:
  # compose là infra-only, service chạy host JVM `make dev svc=catalog`.
  # Bật image chỉ ở profile full (SF-10): docker compose --profile full up catalog-service
  catalog-service:
    build:
      # repo root — Dockerfile COPY backend/... từ context gốc (như template-service)
      context: .
      dockerfile: backend/services/catalog-service/Dockerfile
    container_name: ecommerce-catalog-service
    profiles:
      - full
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_catalog
      RABBITMQ_HOST: rabbitmq
      REDIS_HOST: redis
      ELASTICSEARCH_URI: http://elasticsearch:9200
    expose:
      - "8082"   # internal — gateway (full profile) gọi qua service name
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - ecommerce-net

  # SF-9 (2026-09-06): ordering-service (port 8085, db_ordering) — KHÔNG chạy dev
  # (infra-only; service host qua `make dev svc=ordering`). Profile full (SF-10).
  ordering-service:
    build:
      context: .
      dockerfile: backend/services/ordering-service/Dockerfile
    container_name: ecommerce-ordering-service
    profiles:
      - full
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_ordering
      RABBITMQ_HOST: rabbitmq
      IDENTITY_JWKS_URI: http://identity-service:8081/.well-known/jwks.json
      CATALOG_BASE_URL: http://catalog-service:8082
      INVENTORY_BASE_URL: http://inventory-service:8084
      PAYMENT_BASE_URL: http://payment-service:8086
      INVOICE_SERVICE_URL: http://invoice-service:8090
    expose:
      - "8085"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      invoice-service:
        condition: service_healthy
    networks:
      - ecommerce-net

  # SF-6 (2026-09-06): cart-service (port 8083, KHÔNG DB — Redis thuần D8).
  # Dev: host JVM `make dev svc=cart`. Profile full (SF-10) build image.
  cart-service:
    build:
      context: .
      dockerfile: backend/services/cart-service/Dockerfile
    container_name: ecommerce-cart-service
    profiles:
      - full
    environment:
      REDIS_HOST: redis
      # enrichment gọi service khác qua service name (full profile)
      CATALOG_BASE_URL: http://catalog-service:8082
      INVENTORY_BASE_URL: http://inventory-service:8084
    expose:
      - "8083"   # internal — gateway (full profile) gọi qua service name
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ecommerce-net

  # SF-9 (2026-09-06): invoice-service (D18) — 🐍 Python FastAPI + ReportLab,
  # stateless PDF renderer :8090 INTERNAL ONLY (KHÔNG route qua gateway).
  # Đây là service Python ĐẦU TIÊN chạy dev được (`make dev svc=invoice-service`).
  invoice-service:
    build:
      context: ./services/invoice-service
      dockerfile: Dockerfile
    container_name: ecommerce-invoice-service
    environment:
      INVOICE_FONT_PATH: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
    ports:
      - "8090:8090"   # host map — ordering host-JVM gọi http://localhost:8090 ở dev
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8090/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # SF-11 (2026-09-07): partner-api (port 8091, db_partner) — Open API đối tác
  # (X-API-Key + rate-limit + /open-api/v1 + webhook HMAC). KHÔNG chạy dev
  # (infra-only; host JVM qua `make dev svc=partner-api`). Profile full (SF-10).
  partner-api:
    build:
      context: .
      dockerfile: backend/services/partner-api/Dockerfile
    container_name: ecommerce-partner-api
    profiles:
      - full
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_partner
      RABBITMQ_HOST: rabbitmq
      PARTNER_IDENTITY_BASE_URL: http://identity-service:8081
      PARTNER_ORDERING_BASE_URL: http://ordering-service:8085
      PARTNER_CATALOG_BASE_URL: http://catalog-service:8082
    expose:
      - "8091"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce-net

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  mailpitdata:
  mongodata:
  esdata:

networks:
  ecommerce-net:
    name: ecommerce-net
