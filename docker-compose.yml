# Ecommerce platform — INFRA ONLY (dev mode).
# Backend services KHÔNG containerize ở dev — chạy host qua `make dev svc=<name>`.
# Containerize toàn bộ = profile `full` (SF-10, `make full`).
# Append-only per SF (shared-file ownership §6): SF mới thêm service block, không sửa block người khác.

name: ecommerce

services:
  postgres:
    image: postgres:16
    container_name: ecommerce-postgres
    # full mode: 11 JVM pools + seed — default 100 quá thấp (seed fail "too many clients")
    command: postgres -c max_connections=300
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      # Host 5433 (không phải 5432): máy dev đang có postgres compose khác
      # (hub-store) giữ 5432 — override bằng PG_HOST_PORT trong .env nếu cần.
      - "${PG_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7
    container_name: ecommerce-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ecommerce-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mailpit:
    image: axllent/mailpit
    container_name: ecommerce-mailpit
    ports:
      - "1025:1025"   # SMTP sink (services gửi mail dev vào đây)
      - "8025:8025"   # UI xem email
    volumes:
      - mailpitdata:/data
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8025/readyz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # D14 (2026-09-06): mongo cho log-service (SF-10 build service; container từ SF-1)
  mongo:
    image: mongo:7
    container_name: ecommerce-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mongo-express:
    image: mongo-express:1.0.2
    container_name: ecommerce-mongo-express
    ports:
      - "8089:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH: "false"   # dev-only UI — không auth (k8s/prod sẽ không chạy mongo-express)
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - ecommerce-net
    healthcheck:
      # image node-alpine — không có wget/curl, dùng http.get của node
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:8081',r=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # D15 (2026-09-06): Elasticsearch cho search (SF-4 build engine/indexer; container từ SF-1)
  elasticsearch:
    image: elasticsearch:8.17.4
    container_name: ecommerce-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s

  # Chỉ bật khi cần test webhook Stripe thật: docker compose --profile stripe up -d stripe-cli
  # Forward → payment-service chạy host :8086 (SF-5 sở hữu endpoint).
  # NOTE (SF-5 fix): service mount /payment/webhook (gateway StripPrefix bóc /api
  # khi đi qua :8080) — forward thẳng service path, không có /api.
  stripe-cli:
    image: stripe/stripe-cli
    container_name: ecommerce-stripe-cli
    profiles:
      - stripe
    command: listen --forward-to host.docker.internal:8086/payment/webhook
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY:-}  # thiếu key → stripe-cli lỗi rõ khi bật profile, không vỡ compose
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD", "stripe", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3

  # SF-4 (2026-09-06): catalog-service (port 8082, db_catalog) — KHÔNG chạy dev:
  # compose là infra-only, service chạy host JVM `make dev svc=catalog`.
  # Bật image chỉ ở profile full (SF-10): docker compose --profile full up catalog-service
  catalog-service:
    build:
      # repo root — Dockerfile COPY backend/... từ context gốc (như template-service)
      context: .
      dockerfile: backend/services/catalog-service/Dockerfile
    container_name: ecommerce-catalog-service
    profiles:
      - full
    environment:
      JWT_PUBLIC_KEY_PATH: /keys/jwt-public.pem   # JWT keys (patch FI-397 demo)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_catalog
      RABBITMQ_HOST: rabbitmq
      REDIS_HOST: redis
      ELASTICSEARCH_URI: http://elasticsearch:9200
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200   # QA-F2-02 (FI-408) — health indicator đọc spring.elasticsearch.uris, không phải custom ELASTICSEARCH_URI
      INVENTORY_BASE_URL: http://inventory-service:8084   # CFG-A (FI-408) — default localhost không tới được trong container
      CATALOG_MINIO_ENABLED: "true"       # SF-13 A3 — upload MinIO (review G1)
      CATALOG_MINIO_ENDPOINT: http://minio:9000
    volumes:
      - ./infra/keys:/keys:ro   # JWT keys (patch FI-397 demo)
    expose:
      - "8082"   # internal — gateway (full profile) gọi qua service name
    healthcheck:   # CFG-C (FI-408) — JVM service cần signal unhealthy
      test: ["CMD-SHELL", "curl -sf http://localhost:8082/actuator/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - ecommerce-net

  # SF-9 (2026-09-06): ordering-service (port 8085, db_ordering) — KHÔNG chạy dev
  # (infra-only; service host qua `make dev svc=ordering`). Profile full (SF-10).
  ordering-service:
    build:
      context: .
      dockerfile: backend/services/ordering-service/Dockerfile
    container_name: ecommerce-ordering-service
    profiles:
      - full
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_ordering
      RABBITMQ_HOST: rabbitmq
      IDENTITY_JWKS_URI: http://identity-service:8081/.well-known/jwks.json
      CATALOG_BASE_URL: http://catalog-service:8082
      ORDERING_PRICING_BYIDPATH: /api/catalog/products/by-id/  # FI-397 demo — re-price public by-id (path admin cần ROLE_ADMIN → 401 → saga 502)
      INVENTORY_BASE_URL: http://inventory-service:8084
      PAYMENT_BASE_URL: http://payment-service:8086
      INVOICE_SERVICE_URL: http://invoice-service:8090
      AFFILIATE_BASE_URL: http://affiliate-service:8092   # CFG-A (FI-408) — default localhost không tới được trong container (LoyaltyClient)
    expose:
      - "8085"
    healthcheck:   # CFG-C (FI-408) — JVM service cần signal unhealthy
      test: ["CMD-SHELL", "curl -sf http://localhost:8085/actuator/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      invoice-service:
        condition: service_healthy
    networks:
      - ecommerce-net

  # SF-6 (2026-09-06): cart-service (port 8083, KHÔNG DB — Redis thuần D8).
  # Dev: host JVM `make dev svc=cart`. Profile full (SF-10) build image.
  cart-service:
    build:
      context: .
      dockerfile: backend/services/cart-service/Dockerfile
    container_name: ecommerce-cart-service
    profiles:
      - full
    environment:
      JWT_PUBLIC_KEY_PATH: /keys/jwt-public.pem   # JWT keys (patch FI-397 demo)
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq   # QA-F2-01 (FI-408) — thiếu env → indicator bắn localhost:5672 trong container (SF-2 dry-run)
      # enrichment gọi service khác qua service name (full profile)
      CATALOG_BASE_URL: http://catalog-service:8082
      INVENTORY_BASE_URL: http://inventory-service:8084
    volumes:
      - ./infra/keys:/keys:ro   # JWT keys (patch FI-397 demo)
    expose:
      - "8083"   # internal — gateway (full profile) gọi qua service name
    healthcheck:   # CFG-C (FI-408) — JVM service cần signal unhealthy
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/actuator/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ecommerce-net

  # SF-9 (2026-09-06): invoice-service (D18) — 🐍 Python FastAPI + ReportLab,
  # stateless PDF renderer :8090 INTERNAL ONLY (KHÔNG route qua gateway).
  # Đây là service Python ĐẦU TIÊN chạy dev được (`make dev svc=invoice-service`).
  invoice-service:
    build:
      context: ./services/invoice-service
      dockerfile: Dockerfile
    container_name: ecommerce-invoice-service
    environment:
      INVOICE_FONT_PATH: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
    ports:
      - "8090:8090"   # host map — ordering host-JVM gọi http://localhost:8090 ở dev
    networks:
      - ecommerce-net
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8090/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # SF-11 (2026-09-07): partner-api (port 8091, db_partner) — Open API đối tác
  # (X-API-Key + rate-limit + /open-api/v1 + webhook HMAC). KHÔNG chạy dev
  # (infra-only; host JVM qua `make dev svc=partner-api`). Profile full (SF-10).
  partner-api:
    build:
      context: .
      dockerfile: backend/services/partner-api/Dockerfile
    container_name: ecommerce-partner-api
    profiles:
      - full
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_partner
      RABBITMQ_HOST: rabbitmq
      PARTNER_IDENTITY_BASE_URL: http://identity-service:8081
      PARTNER_ORDERING_BASE_URL: http://ordering-service:8085
      PARTNER_CATALOG_BASE_URL: http://catalog-service:8082
    expose:
      - "8091"
    healthcheck:   # CFG-C (FI-408) — JVM service cần signal unhealthy
      test: ["CMD-SHELL", "curl -sf http://localhost:8091/actuator/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce-net

  # SF-12 (2026-09-07): affiliate-service (D20, port 8092, db_affiliate) —
  # KHÔNG chạy dev (infra-only; host JVM qua `make dev svc=affiliate`).
  # Profile full (SF-10): consume order.confirmed → ledger hoa hồng.
  affiliate-service:
    build:
      context: .
      dockerfile: backend/services/affiliate-service/Dockerfile
    container_name: ecommerce-affiliate-service
    profiles:
      - full
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_affiliate
      RABBITMQ_HOST: rabbitmq
      SECURITY_JWKS_URI: http://identity-service:8081/.well-known/jwks.json
      AFFILIATE_DEFAULT_RATE: ${AFFILIATE_DEFAULT_RATE:-5}
      JWT_PUBLIC_KEY_PATH: /keys/jwt-public.pem   # CFG-B (FI-408) — thiếu env+volume → JwtDecoderConfig chết trong container
    volumes:
      - ./infra/keys:/keys:ro   # CFG-B (FI-408) — JWT keys mount như 6 service khác
    expose:
      - "8092"
    healthcheck:   # CFG-C (FI-408) — JVM service cần signal unhealthy
      test: ["CMD-SHELL", "curl -sf http://localhost:8092/actuator/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce-net

  # ═══ SF-10 (2026-09-07, FI-320): profile full — TOÀN BỘ containerized ═══

  # identity-service :8081 — JWT RS256 keys mount từ ./infra/keys (`make keys`)
  identity-service:
    build:
      context: .
      dockerfile: backend/services/identity-service/Dockerfile
    container_name: ecommerce-identity-service
    profiles:
      - full
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_identity
      JWT_PRIVATE_KEY_PATH: /keys/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /keys/jwt-public.pem
      RABBITMQ_HOST: rabbitmq   # QA-F2-01 (FI-408) — thiếu env → indicator bắn localhost:5672 trong container (SF-2 dry-run)
    volumes:
      - ./infra/keys:/keys:ro
    expose:
      - "8081"
    healthcheck:   # CFG-C (FI-408) — JVM service cần signal unhealthy
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/actuator/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-net

  # inventory-service :8084
  inventory-service:
    build:
      context: .
      dockerfile: backend/services/inventory-service/Dockerfile
    container_name: ecommerce-inventory-service
    profiles:
      - full
    environment:
      JWT_PUBLIC_KEY_PATH: /keys/jwt-public.pem   # JWT keys (patch FI-397 demo)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_inventory
      RABBITMQ_HOST: rabbitmq
    volumes:
      - ./infra/keys:/keys:ro   # JWT keys (patch FI-397 demo)
    expose:
      - "8084"
    healthcheck:   # CFG-C (FI-408) — JVM service cần signal unhealthy
      test: ["CMD-SHELL", "curl -sf http://localhost:8084/actuator/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce-net

  # payment-service :8086 — Stripe test keys từ .env (rỗng → degraded 503)
  payment-service:
    build:
      context: .
      dockerfile: backend/services/payment-service/Dockerfile
    container_name: ecommerce-payment-service
    profiles:
      - full
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_payment
      RABBITMQ_HOST: rabbitmq
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    expose:
      - "8086"
    healthcheck:   # CFG-C (FI-408) — JVM service cần signal unhealthy
      test: ["CMD-SHELL", "curl -sf http://localhost:8086/actuator/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce-net

  # notification-service :8087 (D18) — Mailpit SMTP; service-account ADMIN
  # lấy PDF hóa đơn từ ordering (seed script gán role)
  notification-service:
    build:
      context: .
      dockerfile: backend/services/notification-service/Dockerfile
    container_name: ecommerce-notification-service
    profiles:
      - full
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_notification
      RABBITMQ_HOST: rabbitmq
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      NOTIFY_IDENTITY_BASE_URL: http://identity-service:8081
      ORDERING_BASE_URL: http://ordering-service:8085
      NOTIFY_SERVICE_ACCOUNT_EMAIL: ${NOTIFY_SERVICE_ACCOUNT_EMAIL:-notification-svc@ecommerce.local}
      NOTIFY_SERVICE_ACCOUNT_PASSWORD: ${NOTIFY_SERVICE_ACCOUNT_PASSWORD:-NotifySvc#2026}
      NOTIFY_MY_ORDERS_URL: ${NOTIFY_MY_ORDERS_URL:-http://localhost:8080/account/orders}
      NOTIFY_STOCK_ALERT_CATALOG_BASE_URL: http://catalog-service:8082   # CFG-A (FI-408) — default localhost không tới được trong container
    expose:
      - "8087"
    healthcheck:   # CFG-C (FI-408) — JVM service cần signal unhealthy
      test: ["CMD-SHELL", "curl -sf http://localhost:8087/actuator/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    networks:
      - ecommerce-net

  # log-service :8088 (D14) — Mongo event_log fan-in (queue bind '#')
  log-service:
    build:
      context: .
      dockerfile: backend/services/log-service/Dockerfile
    container_name: ecommerce-log-service
    profiles:
      - full
    environment:
      JWT_PUBLIC_KEY_PATH: /keys/jwt-public.pem   # JWT keys (patch FI-397 demo)
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: db_log
      RABBITMQ_HOST: rabbitmq
    volumes:
      - ./infra/keys:/keys:ro   # JWT keys (patch FI-397 demo)
    expose:
      - "8088"
    healthcheck:   # CFG-C (FI-408) — JVM service cần signal unhealthy
      test: ["CMD-SHELL", "curl -sf http://localhost:8088/actuator/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce-net

  # affiliate + partner cần JWKS qua identity — đã có ở block SF-12/SF-11.

  # gateway :8080 (full) — routes dịch qua service name (env-uri SF-10 T4)
  gateway:
    build:
      context: .
      dockerfile: backend/gateway/Dockerfile
    container_name: ecommerce-gateway
    profiles:
      - full
    environment:
      IDENTITY_URI: http://identity-service:8081
      IDENTITY_JWKS_URI: http://identity-service:8081/.well-known/jwks.json
      CATALOG_URI: http://catalog-service:8082
      CART_URI: http://cart-service:8083
      INVENTORY_URI: http://inventory-service:8084
      ORDERING_URI: http://ordering-service:8085
      PAYMENT_URI: http://payment-service:8086
      NOTIFICATION_URI: http://notification-service:8087
      PARTNER_API_URI: http://partner-api:8091
      AFFILIATE_URI: http://affiliate-service:8092
      LOG_URI: http://log-service:8088        # SF-13 — thiếu env → gateway 500 'Connection refused localhost:8088' (full mode)
      STOREFRONT_WEB_URI: http://storefront-web:3000
      SHELL_WEB_ORIGIN: http://frontend-web:80
      MINIO_URI: http://minio:9000        # SF-13 A3 — route /media/** (review G1)
      SPRING_PROFILES_ACTIVE: full
    ports:
      - "8080:8080"   # public entry duy nhất của stack full
    healthcheck:   # CFG-C (FI-408) — JVM service cần signal unhealthy
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      identity-service:
        condition: service_started
      catalog-service:
        condition: service_started
      cart-service:
        condition: service_started
      inventory-service:
        condition: service_started
      ordering-service:
        condition: service_started
      payment-service:
        condition: service_started
      notification-service:
        condition: service_started
      log-service:
        condition: service_started
      partner-api:
        condition: service_started
      affiliate-service:
        condition: service_started
    # storefront-web/frontend-web KHÔNG depends_on gateway (cycle — code-review
    # P0): gateway route lazily, FE containers up sau cũng không sao.
    networks:
      - ecommerce-net

  # storefront-web :3000 (full) — Next standalone container riêng (pack item 3);
  # SSR fetch gateway nội bộ; host chỉ truy cập qua gateway :8080 (D16).
  storefront-web:
    build:
      context: .
      dockerfile: frontend/apps/storefront-web/Dockerfile
    container_name: ecommerce-storefront-web
    profiles:
      - full
    environment:
      GATEWAY_URL: http://gateway:8080
      SITE_URL: ${SITE_URL:-http://localhost:8080}
      NEXT_PUBLIC_SHELL_URL: ${NEXT_PUBLIC_SHELL_URL:-http://localhost:8080}
    expose:
      - "3000"
    networks:
      - ecommerce-net

  # frontend-web (full) — nginx static: shell dist + 4 remotes (D16 shell origin)
  frontend-web:
    build:
      context: .
      dockerfile: frontend/Dockerfile.web
      args:
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}   # pk_* public — bake FE (golden-path Stripe)
    container_name: ecommerce-frontend-web
    profiles:
      - full
    expose:
      - "80"
    networks:
      - ecommerce-net

  # ── SF-13 (FI-323) A3 — MinIO object storage (append-only block per SF) ────
  # Ảnh sản phẩm: catalog-service upload S3 API :9000; public read qua gateway
  # route /media/** (RewritePath /media/<seg> → /<seg> = bucket/key).
  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: ecommerce-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API — catalog upload + gateway /media
      - "9001:9001"   # console (dev)
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ecommerce-net

  # One-shot: bucket `products` + policy anonymous download (idempotent).
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: ecommerce-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      (mc mb -p local/products || true) &&
      mc anonymous set download local/products"
    restart: "no"
    networks:
      - ecommerce-net

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  mailpitdata:
  mongodata:
  esdata:
  miniodata:

networks:
  ecommerce-net:
    name: ecommerce-net
