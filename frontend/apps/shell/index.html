<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>shell — ecommerce MF harness</title>
    <script>
      // Anti-FOUC dark mode (SF-15): set data-theme TRƯỚC paint —
      // localStorage['ecommerce.theme'] → prefers-color-scheme → storefront.
      (function () {
        try {
          var t = localStorage.getItem('ecommerce.theme');
          var d = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          t = t === 'dark' || (!t && d) ? 'dark' : 'storefront';
          document.documentElement.dataset.theme = t;
        } catch (e) {
          /* private mode */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
