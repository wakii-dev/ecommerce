# thêm version mới khi dep đã có ở đây. Thêm dep mới = thêm vào catalog.
catalog:
  react: ^18.3.1
  react-dom: ^18.3.1
  react-router-dom: ^6.28.0
  "@tanstack/react-query": ^5.62.0
  # MF cho Vite — KHÔNG phải @module-federation/enhanced (webpack-only)
  "@module-federation/vite": ^1.21.3
  vite: ^5.4.11
  "@vitejs/plugin-react": ^4.3.4
  tailwindcss: ^3.4.17
  postcss: ^8.4.49
  autoprefixer: ^10.4.20
  i18next: ^23.16.8
  react-i18next: ^15.1.3
  "@types/react": ^18.3.12
  # codegen cho @ecommerce/contracts (SF-2 Task 10)
  openapi-typescript: ^7.5.2
  json-schema-to-typescript: ^15.0.4
  vitest: ^2.1.8
  # jsdom + testing-library — interaction tests cho useOverlay (SF-2 R3 P1-2)
  jsdom: ^25.0.1
  "@testing-library/react": ^16.1.0
  "@testing-library/dom": ^10.4.0
  playwright: ^1.49.1
  # SF-10 (FI-320) — E2E runner (frontend/e2e)
