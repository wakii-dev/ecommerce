packages:
  - "apps/*"
  - "packages/*"

# ── PRE-PIN (R3) ─────────────────────────────────────────────────────────
# Single source of truth versions cho TOÀN workspace. SF sau dùng `catalog:`
# protocol trong package.json của mình (vd "react": "catalog:") — KHÔNG tự
# thêm version mới khi dep đã có ở đây. Thêm dep mới = thêm vào catalog.
catalog:
  react: ^18.3.1
  react-dom: ^18.3.1
  react-router-dom: ^6.28.0
  "@tanstack/react-query": ^5.62.0
  # MF cho Vite — KHÔNG phải @module-federation/enhanced (webpack-only)
  "@module-federation/vite": ^1.21.3
  vite: ^5.4.11
  "@vitejs/plugin-react": ^4.3.4
  tailwindcss: ^3.4.17
  postcss: ^8.4.49
  autoprefixer: ^10.4.20
  i18next: ^23.16.8
  react-i18next: ^15.1.3
  "@types/react": ^18.3.12
  vitest: ^2.1.8
  playwright: ^1.49.1
  typescript: ^5.7.2
  turbo: ^2.3.3
  eslint: ^9.17.0
  "@eslint/js": ^9.17.0
  typescript-eslint: ^8.18.0
  globals: ^15.14.0
