# frontend-web (SF-10, profile full) — static host cho shell + 4 remotes
# (D16 route split: gateway route shell pages → đây). Shell SPA một dist,
# client router tự xử /cart /checkout /account /admin /order/confirmation
# /login /register → fallback index.html. Remotes build với --base
# /remotes/<name>/ (Dockerfile.web) → remoteEntry.js tại
# /remotes/<name>/remoteEntry.js — khớp REMOTE_*_URL bake lúc build shell.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html/shell;
    index index.html;

    # remote federation — mỗi remote một dist riêng
    location /remotes/account/ {
        alias /usr/share/nginx/html/account/;
        try_files $uri $uri/ /remotes/account/index.html;
    }
    location /remotes/checkout/ {
        alias /usr/share/nginx/html/checkout/;
        try_files $uri $uri/ /remotes/checkout/index.html;
    }
    location /remotes/admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /remotes/admin/index.html;
    }
    location /remotes/skeleton/ {
        alias /usr/share/nginx/html/skeleton/;
        try_files $uri $uri/ /remotes/skeleton/index.html;
    }

    # SPA fallback — mọi path shell khác về index (client router render)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
