# HTTPS edge (docker-compose.https.yml) — TLS offload duy nhất của stack full.
# Browser → :8443 TLS → proxy HTTP nội bộ → gateway :8080 (single entry giữ
# nguyên — edge chỉ terminate TLS, mọi logic route vẫn của gateway).
# Cert self-signed mount từ infra/certs/ (make certs sinh — gitignored).

# WebSocket safe (admin live-update nếu có) — map trong http context (conf.d ✓)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    # TLS 1.2+ — tương thích rộng, không đụng legacy <1.2
    ssl_protocols TLSv1.2 TLSv1.3;

    # Streaming CSV export (SF-13) — flush dần, không buffer hết response
    proxy_buffering off;

    location / {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
