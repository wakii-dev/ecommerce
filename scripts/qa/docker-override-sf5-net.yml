  minio: { networks: !override [sf5-net] }
  identity-service: { networks: !override [sf5-net] }
  catalog-service: { networks: !override [sf5-net] }
  cart-service: { networks: !override [sf5-net] }
  inventory-service: { networks: !override [sf5-net] }
  ordering-service: { networks: !override [sf5-net] }
  payment-service: { networks: !override [sf5-net] }
