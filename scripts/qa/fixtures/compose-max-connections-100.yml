# Fixture self-test case 3 — MAX_CONNECTIONS THẤP: postgres 100 < 110
# → trục (c) DANGEROUS. Các trục khác sạch.
services:
  postgres:
    image: postgres:16
    command: postgres -c max_connections=100
    healthcheck:
      test: pg_isready
  alpha-service:
    build:
      context: .
      dockerfile: backend/services/alpha-service/Dockerfile
    environment:
      LOG_URI: http://localhost:8088
    healthcheck:
      test: true
  beta-service:
    build:
      context: .
      dockerfile: backend/services/beta-service/Dockerfile
    environment:
      JWT_PUBLIC_KEY_PATH: /keys/jwt-public.pem
    volumes:
      - ./keys:/keys:ro
    healthcheck:
      test: true
