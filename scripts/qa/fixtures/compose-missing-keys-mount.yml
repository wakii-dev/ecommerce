# Fixture self-test case 2 — THIẾU KEYS MOUNT: beta-service đọc /keys/jwt-public.pem
# nhưng compose không set env + không volume → trục (b) DANGEROUS. Các trục khác sạch.
services:
  postgres:
    image: postgres:16
    command: postgres -c max_connections=300
    healthcheck:
      test: pg_isready
  alpha-service:
    build:
      context: .
      dockerfile: backend/services/alpha-service/Dockerfile
    environment:
      LOG_URI: http://localhost:8088
    healthcheck:
      test: true
  beta-service:
    build:
      context: .
      dockerfile: backend/services/beta-service/Dockerfile
    environment:
      OTHER_VAR: whatever
    healthcheck:
      test: true
