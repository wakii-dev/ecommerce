[project]
name = "invoice-service"
version = "0.1.0"
description = "Stateless PDF invoice renderer (D18) — FastAPI + ReportLab, không giữ business data"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "reportlab>=4.2",
    "pydantic>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "pypdf>=4.3",
]

[tool.pytest.ini_options]
# rootdir = services/invoice-service — import app.* trực tiếp, không cần pip install
pythonpath = ["."]
testpaths = ["tests"]
